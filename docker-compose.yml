# Mantiene el nombre de proyecto anterior para conservar los volúmenes existentes (pgdata, uploads).
name: backend-proyecto-frontend

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: streaming
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d streaming"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD:-app}@db:5432/streaming
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: http://localhost:5173,http://localhost:5500,http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ../frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_ENABLE_DEV_TOOLS: "true"
    ports:
      - "5173:5173"
    depends_on:
      - api
    # Sin carpeta compartida: en Windows leer el código a través de ella hacía que cada página
    # tardara segundos. `docker compose watch` copia al contenedor cada archivo que guardas
    # (Vite recarga al instante) y reconstruye la imagen si cambian las dependencias.
    develop:
      watch:
        - action: sync
          path: ../frontend/src
          target: /app/src
        - action: sync
          path: ../frontend/public
          target: /app/public
        - action: sync
          path: ../frontend/index.html
          target: /app/index.html
        - action: rebuild
          path: ../frontend/package.json
        - action: rebuild
          path: ../frontend/vite.config.js

volumes:
  pgdata:
  uploads:
